# A version tag (git tag v0.1.0 && git push origin v0.1.0) publishes the app's and
# the sandbox's images, so people download them instead of building, and opens a
# GitHub release with that version's notes from CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "app=ghcr.io/$owner/rimuru" >> "$GITHUB_OUTPUT"
          echo "sandbox=ghcr.io/$owner/rimuru-sandbox" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The app's image
        run: |
          docker build -t "${{ steps.names.outputs.app }}:${{ steps.names.outputs.version }}" \
                       -t "${{ steps.names.outputs.app }}:latest" .
          docker push --all-tags "${{ steps.names.outputs.app }}"
      - name: The clones' sandbox image
        run: |
          tag="$(python3 -c 'import re; print(re.search(r"SANDBOX_IMAGE = \"rimuru-sandbox:(\w+)\"", open("rimuru/worker/shell.py").read()).group(1))')"
          docker build -t "${{ steps.names.outputs.sandbox }}:$tag" sandbox
          docker push "${{ steps.names.outputs.sandbox }}:$tag"
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF' > notes.md
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          found = re.search(r"^## \[?${{ steps.names.outputs.version }}\]?.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(found.group(1).strip() if found else "See CHANGELOG.md.")
          EOF
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Rimuru $GITHUB_REF_NAME" --notes-file notes.md
